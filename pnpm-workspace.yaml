lockfileIncludeTarballUrl: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@softarc/*"
  - "@angular/*"
  - "@angular-devkit/*"
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  msw: true
  nx: false
# nx (via @nx/devkit) pins these to vulnerable versions; drop once nx ships the fixes
overrides:
  'nx>axios': '^1.20.0'
  'nx>brace-expansion': '^5.0.12'
  'nx>smol-toml': '^1.7.1'
