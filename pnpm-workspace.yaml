lockfileIncludeTarballUrl: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@softarc/*"
  - "@angular/*"
  - "@angular-devkit/*"
  - '@ngtools/webpack'
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  msw: true
  nx: false
overrides:
  'axios': '>=1.18.0'
  # brace-expansion 5 is ESM-only named exports; minimatch 3 (via eslint 9's
  # config-array, which this branch keeps for Angular 21) needs the CJS default
  # function. 1.1.12 is the 1.x line's fix for the same ReDoS advisory.
  'minimatch@3>brace-expansion': '^1.1.12'
  'brace-expansion': '>=5.0.9'
  'fast-uri': '>=3.1.5'
